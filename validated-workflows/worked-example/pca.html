<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paired PCA · Colorectal RNA-seq</title>
<style>
body { margin: 0; background: #faf9f4; color: #192822; font: 16px/1.5 Helvetica, Arial, sans-serif; }
main { width: min(720px, calc(100% - 32px)); margin: 28px auto; }
h1 { margin: 0 0 15px; font: 500 clamp(32px, 5.5vw, 50px)/1.08 Georgia, serif; }
p { font-size: 14px; color: #465b51; }
a { color: #155e4a; text-underline-offset: .16em; }
</style>
<style id="pca-styles">
.pca-explorer { margin: 13px 0; padding: 12px; border: 1px solid #d5ded5; border-radius: 6px; background: #fffefa; }
.pca-explorer [hidden] { display: none; }
.pca-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 8px; }
.pca-controls span { font-size: 13px; color: #465b51; margin-right: 5px; }
.pca-controls button { padding: 0 10px; min-height: 44px; border: 1px solid #c5d5c9; border-radius: 6px; background: #fffefa; color: #192822; font: 600 13px Helvetica, Arial, sans-serif; cursor: pointer; }
.pca-controls button[aria-pressed="true"] { background: #155e4a; border-color: #155e4a; color: white; }
.pca-controls button:focus-visible { outline: 2px solid #155e4a; outline-offset: 2px; }
.pca-explorer canvas { display: block; width: 100%; aspect-ratio: 1.64; }
.pca-static { display: block; width: 100%; height: auto; }
.pca-key { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; padding: 0 4px 3px; font-size: 13px; color: #465b51; }
.pca-symbols { white-space: nowrap; }
.pca-symbols span + span { margin-left: 8px; }
.pca-symbols b { margin-right: 3px; }
.pca-symbols[data-tissue="true"] .pca-adjacent b { color: var(--pca-adjacent); }
.pca-symbols[data-tissue="true"] .pca-tumor b { color: var(--pca-tumor); }
.pca-scale { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.pca-ramp { width: 76px; height: 11px; border: 1px solid #566561; border-radius: 2px; }
.pca-categories { display: inline-flex; flex-wrap: wrap; gap: 4px 11px; }
.pca-category { white-space: nowrap; }
.pca-swatch { display: inline-block; width: 11px; height: 11px; margin-right: 4px; border: 1px solid #22312b; border-radius: 2px; }
@media (max-width: 440px) { .pca-controls span { flex-basis: 100%; } }
</style>
</head>

<script>
(() => {
  const root = document.getElementById('colorectal-pca');
  const {points, links, variance} = JSON.parse(document.getElementById('pca-data').textContent);
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const controls = root.querySelector('.pca-controls');
  const buttons = Array.from(controls.querySelectorAll('button'));
  const key = root.querySelector('.pca-key');
  const symbols = root.querySelector('.pca-symbols');
  const scale = root.querySelector('.pca-scale');
  const categoryKey = root.querySelector('.pca-categories');
  const categories = {
    tissue: {'Adjacent tissue': '#12649b', Tumor: '#bf4b19'},
    sex: {Female: '#6743a5', Male: '#08785e'},
    site: {Colon: '#b34b11', Rectum: '#185f99'},
    ageGroup: {'Under 65': '#6743a5', '65 or older': '#b34b11'},
    stage: {T2N1M0: '#12649b', T2N2M0: '#a65e00', T3N1M0: '#99447b'},
  };
  const ramp = [[68, 1, 84], [59, 82, 139], [33, 145, 140], [94, 201, 98], [253, 231, 37]];
  root.style.setProperty('--pca-adjacent', categories.tissue['Adjacent tissue']);
  root.style.setProperty('--pca-tumor', categories.tissue.Tumor);
  scale.querySelector('.pca-ramp').style.background = `linear-gradient(90deg, ${ramp.map(color => 'rgb(' + color.join(',') + ')').join(',')})`;
  const millions = value => (value / 1e6).toFixed(1) + 'M';
  const formats = {
    pairs: millions,
    counts: millions,
    genes: value => value.toLocaleString('en-US'),
    size: value => value.toString(),
  };
  const ranges = Object.fromEntries(Object.keys(formats).map(field => {
    const values = points.map(point => point[field]);
    return [field, [Math.min(...values), Math.max(...values)]];
  }));
  let field = 'tissue';

  function fill(point) {
    if (categories[field]) return categories[field][point[field]];
    const [low, high] = ranges[field];
    const fraction = high === low ? 0.5 : (point[field] - low) / (high - low);
    const position = fraction * (ramp.length - 1);
    const segment = Math.min(Math.floor(position), ramp.length - 2);
    const start = ramp[segment];
    const end = ramp[segment + 1];
    return 'rgb(' + start.map((channel, i) => Math.round(channel + (end[i] - channel) * (position - segment))).join(',') + ')';
  }

  function line(x1, y1, x2, y2, color) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  function draw() {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if (!width || !height) return;
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const plotWidth = width - 58;
    const plotHeight = height - 53;
    const unit = Math.min(plotWidth / 90, plotHeight / 54);
    const x = value => 46 + plotWidth / 2 + (value - 2) * unit;
    const y = value => 10 + plotHeight / 2 - (value - 7) * unit;
    const radius = width < 430 ? 4.5 : 5.8;

    ctx.fillStyle = '#465b51';
    ctx.font = '12px Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    for (const tick of [-40, -20, 0, 20, 40]) {
      line(x(tick), y(34), x(tick), y(-20), '#e1e7e0');
      ctx.fillText(tick, x(tick), y(-20) + 16);
    }
    ctx.textAlign = 'right';
    for (const tick of [-10, 0, 10, 20, 30]) {
      line(x(-43), y(tick), x(47), y(tick), '#e1e7e0');
      ctx.fillText(tick, x(-43) - 5, y(tick) + 4);
    }
    for (const [start, end] of links) {
      const a = points[start];
      const b = points[end];
      line(x(a.pc1), y(a.pc2), x(b.pc1), y(b.pc2), '#9aada1');
    }
    for (const point of points) {
      const left = x(point.pc1);
      const top = y(point.pc2);
      ctx.beginPath();
      if (point.tissue === 'Tumor') {
        ctx.moveTo(left, top - radius * 1.25);
        ctx.lineTo(left + radius * 1.1, top + radius * 0.86);
        ctx.lineTo(left - radius * 1.1, top + radius * 0.86);
        ctx.closePath();
      } else {
        ctx.arc(left, top, radius, 0, 2 * Math.PI);
      }
      ctx.fillStyle = fill(point);
      ctx.fill();
      ctx.strokeStyle = '#22312b';
      ctx.lineWidth = 1.35;
      ctx.stroke();
    }

    ctx.fillStyle = '#192822';
    ctx.font = '600 13px Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PC1 · ' + variance[0].toFixed(1) + '%', x(2), y(-20) + 35);
    ctx.save();
    ctx.translate(13, y(7));
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('PC2 · ' + variance[1].toFixed(1) + '%', 0, 0);
    ctx.restore();
  }

  function select(button) {
    field = button.dataset.field;
    for (const option of buttons) option.setAttribute('aria-pressed', String(option === button));
    symbols.dataset.tissue = String(field === 'tissue');
    scale.hidden = !ranges[field];
    categoryKey.hidden = field === 'tissue' || !categories[field];
    if (!categoryKey.hidden) {
      const entries = Object.entries(categories[field]).map(([label, color]) => {
        const item = document.createElement('span');
        item.className = 'pca-category';
        const swatch = document.createElement('span');
        swatch.className = 'pca-swatch';
        swatch.style.backgroundColor = color;
        swatch.setAttribute('aria-hidden', 'true');
        item.append(swatch, label);
        return item;
      });
      categoryKey.replaceChildren(...entries);
    }
    if (!scale.hidden) {
      const [low, high] = ranges[field].map(formats[field]);
      scale.querySelector('.pca-low').textContent = low;
      scale.querySelector('.pca-high').textContent = high;
      scale.setAttribute('aria-label', button.textContent + ': ' + low + ' to ' + high);
    }
    draw();
  }

  for (const button of buttons) button.addEventListener('click', () => select(button));
  controls.hidden = false;
  key.hidden = false;
  canvas.hidden = false;
  root.querySelector('.pca-static').hidden = true;
  select(buttons[0]);
  new ResizeObserver(draw).observe(canvas);
})();
</script>
