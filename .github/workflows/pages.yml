name: Deploy to GitHub Pages

# Replaces the legacy Pages builder. The site is static: .nojekyll is present
# and there is no _config.yml or Gemfile, so this uploads the repository as-is
# rather than running Jekyll.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it, so a half-published
# site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs on purpose. When both ran as steps of one
  # job, deploy-pages sometimes queried the Artifacts API before the freshly
  # uploaded "github-pages" artifact was visible and failed with
  # 'No artifacts named "github-pages" were found' (Deploy run #32), even though
  # the artifact existed. A separate job starts on a new runner after the upload
  # job has finished, which avoids that race.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against publishing build inputs
        run: |
          test -f .nojekyll || { echo "::error::.nojekyll is missing; Pages would run Jekyll"; exit 1; }
          test -f CNAME || { echo "::error::CNAME is missing; the custom domain would be dropped"; exit 1; }
          grep -q '^orchestrated\.bio$' CNAME || { echo "::error::CNAME does not contain orchestrated.bio"; exit 1; }

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_first_try.outputs.page_url }}
    steps:
      # A transient Pages/Artifacts API error should not need a manual re-run.
      # The first attempt fails while fetching artifact metadata, before any
      # deployment is created, so trying once more is safe.
      - name: Deploy
        id: deployment_first_try
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying
        if: steps.deployment_first_try.outcome == 'failure'
        run: sleep 20

      - name: Deploy (retry)
        id: deployment
        if: steps.deployment_first_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
